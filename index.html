<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سفرتنا | أطباق تراثية أردنية</title>
  <meta name="description" content="سفرتنا – أطباق تراثية أردنية أصيلة محضّرة بحب. اطلب الآن واستمتع بتوصيل مجاني!" />
  <meta name="theme-color" content="#141210" />

  <!-- Google Fonts – Readex Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200..700&display=swap" rel="stylesheet" />

  <!-- Swiper 11 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- App Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════ ANNOUNCEMENT BAR ══════════ -->
  <div class="announcement-bar">
    <span>🚚 رسوم التوصيل مجاناً لجميع الطلبات</span>
  </div>

  <!-- ══════════ HEADER / LOGO ══════════ -->
  <header class="app-header">
    <div class="logo-container" id="logo-container">
      <img id="brand-logo" class="brand-logo" src="" alt="سفرتنا" />
    </div>
  </header>

  <!-- ══════════ MAIN ══════════ -->
  <main>

    <!-- Category Tabs -->
    <nav id="category-tabs" class="category-tabs"></nav>

    <!-- Skeleton Loader -->
    <section id="skeleton-loader" class="skeleton-section">
      <div class="skeleton-slider">
        <div class="skeleton-card"><div class="sk-img sk-pulse"></div><div class="sk-line sk-pulse"></div><div class="sk-line short sk-pulse"></div><div class="sk-btn sk-pulse"></div></div>
        <div class="skeleton-card"><div class="sk-img sk-pulse"></div><div class="sk-line sk-pulse"></div><div class="sk-line short sk-pulse"></div><div class="sk-btn sk-pulse"></div></div>
        <div class="skeleton-card"><div class="sk-img sk-pulse"></div><div class="sk-line sk-pulse"></div><div class="sk-line short sk-pulse"></div><div class="sk-btn sk-pulse"></div></div>
      </div>
    </section>

    <!-- Products Swiper -->
    <section id="products-section" class="products-section" style="display:none">
      <div class="swiper">
        <div class="swiper-wrapper" id="swiper-wrapper"></div>
      </div>
    </section>

    <!-- Empty State -->
    <section id="empty-state" class="empty-state" style="display:none">
      <i class="fa-solid fa-utensils"></i>
      <p>لا توجد منتجات في هذا التصنيف</p>
    </section>

  </main>

  <!-- ══════════ FLOATING CART BAR ══════════ -->
  <div id="cart-bar" class="cart-bar">
    <div class="cart-bar-inner">
      <div class="cart-bar-right">
        <div class="cart-icon-wrap" id="cart-icon-wrap">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge" id="cart-badge">0</span>
        </div>
        <span class="cart-bar-label">سلة المشتريات</span>
      </div>
      <span class="cart-bar-total" id="cart-bar-total">0.00 د.أ</span>
    </div>
  </div>

  <!-- ══════════ CART DRAWER (Bottom Sheet) ══════════ -->
  <div id="cart-overlay" class="drawer-overlay"></div>
  <div id="cart-drawer" class="drawer">
    <div class="drawer-handle"></div>

    <!-- VIEW 1: Cart Items -->
    <div id="cart-view" class="drawer-view">
      <div class="drawer-header">
        <h2><i class="fa-solid fa-cart-shopping"></i> سلة المشتريات</h2>
        <button class="drawer-close" id="btn-close-drawer" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="drawer-body" id="cart-items-container"></div>
      <div class="drawer-footer" id="cart-footer" style="display:none">
        <div class="delivery-badge"><i class="fa-solid fa-truck-fast"></i> 🚚 رسوم التوصيل: <strong>مجاناً</strong></div>
        <div class="total-row"><span>المجموع الكلي:</span><span id="cart-total" class="total-price">0.00 د.أ</span></div>
        <button class="btn-checkout" id="btn-checkout"><i class="fa-brands fa-whatsapp"></i> متابعة الطلب</button>
      </div>
    </div>

    <!-- VIEW 2: WhatsApp Rep Selection (inside same drawer) -->
    <div id="whatsapp-view" class="drawer-view" style="display:none">
      <div class="drawer-header">
        <h2><i class="fa-brands fa-whatsapp" style="color:#25D366"></i> إرسال الطلب</h2>
        <button class="drawer-close" id="btn-back-cart" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <div class="drawer-body wa-body">
        <p class="wa-prompt">اختر المسؤول لتأكيد الطلب عبر واتساب:</p>
        <button class="wa-contact-btn" data-person="ibrahim">
          <div class="wa-avatar"><i class="fa-solid fa-user"></i></div>
          <div class="wa-info"><span class="wa-name">إبراهيم</span><span class="wa-phone" dir="ltr">+962 78 736 4679</span></div>
          <i class="fa-brands fa-whatsapp wa-icon"></i>
        </button>
        <button class="wa-contact-btn" data-person="rakan">
          <div class="wa-avatar"><i class="fa-solid fa-user"></i></div>
          <div class="wa-info"><span class="wa-name">ركان</span><span class="wa-phone" dir="ltr">+962 78 929 001</span></div>
          <i class="fa-brands fa-whatsapp wa-icon"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════ TOAST ══════════ -->
  <div id="toast" class="toast"><i class="fa-solid fa-circle-check"></i> <span>تمت الإضافة إلى السلة ✓</span></div>

  <!-- Swiper 11 JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- App -->
  <script src="app.js"></script>

</body>
</html>
