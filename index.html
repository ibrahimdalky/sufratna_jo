<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="سفرتنا — أكلات تراثية أردنية أصيلة. اطلب الآن وتوصيل مجاني لجميع الطلبات." />
  <meta name="theme-color" content="#FAF6F0" />
  <title>سفرتنا | أكلات تراثية أردنية أصيلة</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- App Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Main Container -->
  <div class="main-container">
    <!-- Header -->
    <header class="site-header" id="siteHeader">
      <button class="logo-wrap" id="interactiveLogo" type="button" aria-label="شعار سفرتنا التفاعلي">
        <span class="logo-motion">
          <span class="logo-touch-glow" aria-hidden="true"></span>
          <span class="logo-placeholder" id="logoPlaceholder"></span>
          <img class="brand-logo" id="brandLogo" alt="سفرتنا" draggable="false" decoding="async" style="display:none;" />
        </span>
      </button>
    </header>

    <!-- Mobile-first journey hero -->
    <section class="journey-hero" aria-labelledby="journeyTitle">
      <div class="journey-hero-glow" aria-hidden="true"></div>
      <h1 id="journeyTitle"><span class="hero-brand-line">سفرتنا..</span> هي خدمة مع أكلات زاكية <span class="hero-student-icon" aria-hidden="true">🎓</span></h1>
      <div class="journey-hero-actions">
        <button class="journey-start-btn" id="journeyStartBtn" type="button"><svg class="cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5h14M5 12h14M5 19h14" /></svg> استكشف المنيو <span aria-hidden="true">↓</span></button>
        <button class="refresh-btn" id="refreshBtn" type="button" aria-label="تحديث الأصناف">↻</button>
        <span class="sync-status" id="syncStatus" aria-live="polite"></span>
      </div>
    </section>

    <!-- Category Pills -->
    <nav class="category-nav" id="categoryNav">
      <div class="category-scroll" id="categoryScroll">
        <!-- pills injected by JS -->
      </div>
    </nav>

    <div class="menu-view-toolbar" id="menuViewToolbar" hidden>
      <div class="menu-view-switch" role="group" aria-label="طريقة عرض الأصناف">
        <button class="menu-view-button" id="menuViewRing" type="button" aria-pressed="true" aria-controls="swiperWrapper">العرض الدائري</button>
        <button class="menu-view-button" id="menuViewGrid" type="button" aria-pressed="false" aria-controls="swiperWrapper">عرض الكل</button>
      </div>
      <button class="menu-pick-button" id="menuPickProduct" type="button" aria-label="شو آكل؟ اقترح صنفًا من القسم" aria-controls="swiperWrapper"><span aria-hidden="true">⤨</span> شو آكل؟</button>
      <span class="menu-pick-status" id="menuPickStatus" role="status" aria-atomic="true"></span>
    </div>

    <!-- Skeleton Loader -->
    <div class="skeleton-grid" id="skeletonLoader">
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
    </div>

    <!-- Error State -->
    <div class="error-state" id="errorState" style="display:none;">
      <div class="error-card">
        <span class="error-icon">⚠️</span>
        <p>حدث خطأ في تحميل المنتجات</p>
        <button class="retry-btn" id="retryBtn">إعادة المحاولة</button>
      </div>
    </div>

    <!-- Product gallery -->
    <div class="product-gallery" id="productSwiper" role="region" aria-label="معرض أصناف سفرتنا" tabindex="0" style="display:none;">
      <button class="gallery-motion-toggle" id="galleryMotionToggle" type="button" hidden></button>
      <div class="swipe-guide" id="swipeGuide">
        <span class="swipe-guide-arrow" aria-hidden="true">↔</span>
        <span>اسحب</span>
      </div>
      <div class="product-gallery-track" id="swiperWrapper">
        <!-- slides injected by JS -->
      </div>
    </div>
  </div>

  <dialog class="product-details-dialog" id="productDetails" aria-labelledby="productDetailsTitle"></dialog>
  <dialog class="card-share-link-dialog" id="cardShareLinkDialog" aria-labelledby="cardShareLinkTitle">
    <form method="dialog">
      <div class="card-share-link-header">
        <h2 id="cardShareLinkTitle">مشاركة الصنف</h2>
        <button type="submit" class="product-details-close" aria-label="إغلاق مشاركة الصنف" autofocus>×</button>
      </div>
      <label for="cardShareUrl">رابط الصنف</label>
      <input id="cardShareUrl" type="url" dir="ltr" readonly>
      <div class="card-share-product-summary">
        <strong id="cardShareName" dir="auto"></strong>
        <span id="cardSharePrice"></span>
      </div>
      <div class="card-share-link-actions">
        <button id="cardShareNative" type="button" hidden>شارك</button>
        <button id="cardShareCopy" type="button">نسخ التفاصيل</button>
      </div>
      <p class="card-share-status" id="cardShareStatus" role="status" aria-atomic="true"></p>
      <textarea id="cardShareManual" aria-label="نص المشاركة للنسخ" rows="4" readonly hidden></textarea>
    </form>
  </dialog>

  <!-- Floating Cart Bar -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-bar-inner" id="cartBarInner">
      <div class="cart-bar-left">
        <span class="cart-bar-icon">🛒</span>
        <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
      </div>
      <div class="cart-bar-center" aria-live="polite" aria-atomic="true">
        <span id="cartBarText">سلتك فارغة</span>
        <div class="cart-bar-notice" id="cartBarNotice" hidden>
          <span class="cart-notice-label"><span aria-hidden="true">✓</span> انضاف للسلة</span>
          <strong id="cartLastItem" dir="auto"></strong>
        </div>
      </div>
      <div class="cart-bar-right">
        <span id="cartBarTotal"></span>
      </div>
    </div>
  </div>

  <!-- Cart Drawer Overlay -->
  <div class="drawer-overlay" id="drawerOverlay">
    <div class="cart-drawer" id="cartDrawer">
      <div class="drawer-content" id="drawerContent">
        <!-- populated by JS -->
      </div>
    </div>
  </div>

  <!-- App JS -->
  <script src="app.js"></script>
  <script src="logo-interaction.js"></script>
</body>
</html>
