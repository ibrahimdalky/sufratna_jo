<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="سفرتنا — أكلات تراثية أردنية أصيلة. اطلب الآن وتوصيل مجاني لجميع الطلبات." />
  <meta name="theme-color" content="#0D0B09" />
  <title>سفرتنا | أكلات تراثية أردنية أصيلة</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Swiper -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- App Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Particle Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Announcement Bar -->
  <div class="announcement-bar" id="announcementBar">
    <div class="marquee-track">
      <span class="marquee-content">
        🚚 رسوم التوصيل مجاناً لجميع الطلبات &bull; سفرتنا — أكلات تراثية أردنية أصيلة &bull; 🔥 جودة عالية وطعم لا يُنسى &bull;&nbsp;
      </span>
      <span class="marquee-content" aria-hidden="true">
        🚚 رسوم التوصيل مجاناً لجميع الطلبات &bull; سفرتنا — أكلات تراثية أردنية أصيلة &bull; 🔥 جودة عالية وطعم لا يُنسى &bull;&nbsp;
      </span>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Header -->
    <header class="site-header" id="siteHeader">
      <div class="logo-wrap">
        <div class="logo-placeholder" id="logoPlaceholder"></div>
        <img class="brand-logo" id="brandLogo" src="" alt="سفرتنا" style="display:none;" />
      </div>
      <div class="header-divider">
        <span class="divider-line"></span>
        <span class="divider-diamond">◆</span>
        <span class="divider-line"></span>
      </div>
    </header>

    <!-- Category Pills -->
    <nav class="category-nav" id="categoryNav">
      <div class="category-scroll" id="categoryScroll">
        <!-- pills injected by JS -->
      </div>
    </nav>

    <!-- Skeleton Loader -->
    <div class="skeleton-grid" id="skeletonLoader">
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
    </div>

    <!-- Error State -->
    <div class="error-state" id="errorState" style="display:none;">
      <div class="error-card">
        <span class="error-icon">⚠️</span>
        <p>حدث خطأ في تحميل المنتجات</p>
        <button class="retry-btn" id="retryBtn">إعادة المحاولة</button>
      </div>
    </div>

    <!-- Swiper -->
    <div class="swiper" id="productSwiper" style="display:none;">
      <div class="swiper-wrapper" id="swiperWrapper">
        <!-- slides injected by JS -->
      </div>
    </div>
  </div>

  <!-- Floating Cart Bar -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-bar-inner" id="cartBarInner">
      <div class="cart-bar-left">
        <span class="cart-bar-icon">🛒</span>
        <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
      </div>
      <div class="cart-bar-center">
        <span id="cartBarText">سلتك فارغة</span>
      </div>
      <div class="cart-bar-right">
        <span id="cartBarTotal"></span>
      </div>
    </div>
  </div>

  <!-- Cart Drawer Overlay -->
  <div class="drawer-overlay" id="drawerOverlay">
    <div class="cart-drawer" id="cartDrawer">
      <div class="drawer-content" id="drawerContent">
        <!-- populated by JS -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
