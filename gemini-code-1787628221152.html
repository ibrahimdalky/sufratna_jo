<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سفرتنا | Sufratna</title>
  
  <!-- خط Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <!-- أيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط الإعلان العلوي -->
  <div class="top-announcement">
    <span>🚚 رسوم التوصيل مجاناً لجميع الطلبات</span>
  </div>

  <!-- الهيدر واللوجو -->
  <header class="header">
    <div class="logo-container">
      <img src="https://i.ibb.co/3yXBDKkh/Untitled-design.jpg" alt="سفرتنا" id="brand-logo" onerror="this.src='https://via.placeholder.com/120x120/1c1917/c47d4c?text=سفرتنا'">
    </div>
  </header>

  <!-- شريط التصنيفات -->
  <nav class="categories-bar" id="categories-container">
    <button class="cat-btn active" data-category="الكل">الكل</button>
  </nav>

  <!-- منطقة المنتجات (Swiper Carousel) -->
  <main class="products-section">
    <!-- مؤشر التحميل -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>جاري تجهيز سفرتنا...</p>
    </div>

    <!-- السلايدر -->
    <div class="swiper mySwiper" style="display: none;">
      <div class="swiper-wrapper" id="products-wrapper">
        <!-- المنتجات تضاف تلقائياً بالجافاسكربت -->
      </div>
    </div>
  </main>

  <!-- الشريط السفلي الثابت للسلة -->
  <div class="bottom-bar" id="bottom-cart-bar">
    <div class="cart-btn-trigger">
      <div class="cart-icon-wrapper" id="cart-icon-target">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" id="cart-count">0</span>
      </div>
      <span class="cart-text">سلة المشتريات</span>
    </div>
    <div class="cart-total-price">
      <span id="cart-total-display">0.00</span> د.أ
    </div>
  </div>

  <!-- نافذة سلة المشتريات (Drawer Modal) -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-basket-shopping"></i> سلة المشتريات</h3>
        <button class="close-btn" id="close-cart"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body" id="cart-items-container">
        <!-- عناصر السلة تظهر هنا -->
      </div>

      <div class="modal-footer" id="cart-footer">
        <div class="delivery-notice">
          <span>🚚 التوصيل: <strong>مجاناً</strong></span>
        </div>
        <div class="total-row">
          <span>المجموع الكلي:</span>
          <span class="total-sum"><span id="drawer-total">0.00</span> د.أ</span>
        </div>
        <button class="primary-btn" id="proceed-checkout-btn">تأكيد الطلب</button>
      </div>
    </div>
  </div>

  <!-- نافذة اختيار المسؤول للتأكيد عبر واتساب -->
  <div class="modal-overlay" id="rep-modal">
    <div class="modal-content rep-modal-content">
      <div class="modal-header">
        <h3>تأكيد الطلب عبر واتساب</h3>
        <button class="close-btn" id="close-rep"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <p class="rep-subtitle">اختر المسؤول لإرسال تفاصيل طلبك مباشرة:</p>
        
        <div class="rep-buttons">
          <button class="whatsapp-rep-btn" data-rep="ibrahim">
            <i class="fa-brands fa-whatsapp"></i>
            <div class="rep-info">
              <span class="rep-name">تأكيد الطلب مع إبراهيم</span>
              <span class="rep-phone">0787364679</span>
            </div>
          </button>

          <button class="whatsapp-rep-btn" data-rep="rakan">
            <i class="fa-brands fa-whatsapp"></i>
            <div class="rep-info">
              <span class="rep-name">تأكيد الطلب مع ركان</span>
              <span class="rep-phone">078929001</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- إشعار إضافة السلة -->
  <div class="toast" id="toast">تمت الإضافة إلى السلة ✓</div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- تطبيق المتجر -->
  <script src="app.js"></script>
</body>
</html>
